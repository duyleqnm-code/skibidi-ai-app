<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skibidi AI</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-slate-900 text-white font-sans antialiased h-screen flex">

    <!-- Thanh bên trái (Sidebar) -->
    <div id="sidebar" class="w-80 bg-slate-950 border-r border-slate-800 p-4 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-teal-600 p-2.5 rounded-lg text-xl"><i class="fa-solid fa-robot"></i></div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Skibidi AI</h1>
                    <p class="text-xs text-slate-400">Sáng Tạo · Giàu ý tưởng</p>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Cấu hình bộ não</label>
                <input type="password" id="apiKey" placeholder="Nhập Google Gemini API Key..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500 text-white">
                <p class="text-[11px] text-slate-500 mt-1">Lấy key miễn phí tại ://google.com</p>
            </div>
        </div>
        
        <button onclick="clearChat()" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg py-2 text-sm font-medium transition flex items-center justify-center gap-2">
            <i class="fa-regular fa-trash-can"></i> Xóa lịch sử trò chuyện
        </button>
    </div>

    <!-- Khu vực Chat chính -->
    <div class="flex-1 flex flex-col h-full bg-slate-900">
        <!-- Thanh đầu trang -->
        <div class="h-14 border-b border-slate-800 flex items-center px-4 gap-3 bg-slate-950/50">
            <button class="md:hidden text-xl text-slate-400 hover:text-white"><i class="fa-solid fa-bars"></i></button>
            <div class="font-medium">Trò chuyện cùng Skibidi AI</div>
        </div>

        <!-- Màn hình hiển thị tin nhắn -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-robot"></i></div>
                <div class="bg-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-sm max-w-[85%]">
                    Xin chào! Tôi là Skibidi AI. Tôi có thể giúp gì cho bạn hôm nay?
                </div>
            </div>
        </div>

        <!-- Thanh nhập tin nhắn -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/20">
            <div class="max-w-3xl w-full mx-auto flex gap-2 relative items-center">
                <input type="text" id="userInput" onkeypress="handleKeyPress(event)" placeholder="Nhập tin nhắn của bạn..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none focus:border-teal-500">
                <button onclick="sendMessage()" class="absolute right-2 text-teal-500 hover:text-teal-400 p-2 text-lg"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
            <div class="text-[11px] text-slate-500 text-center mt-2">Bấm Enter để gửi, ứng dụng tự làm bởi chính bạn</div>
        </div>
    </div>

    <script>
        let messages = [];

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = input.value.trim();
            if (!text) return;

            // Hiển thị tin nhắn người dùng
            appendMessage('user', text);
            input.value = '';

            if (!apiKey) {
                appendMessage('ai', '❌ Lỗi: Bạn chưa nhập Google Gemini API Key ở thanh bên trái!');
                return;
            }

            appendMessage('ai', '⚡ Skibidi AI đang suy nghĩ và tra cứu...');
            const lastAiMsgDiv = document.getElementById('chatContainer').lastElementChild.querySelector('.bg-slate-800, .bg-slate-700');

            try {
                // Gọi trực tiếp API Gemini của Google
                const response = await fetch(`https://googleapis.com{apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                lastAiMsgDiv.innerText = reply;
            } catch (error) {
                lastAiMsgDiv.innerText = '❌ Không thể kết nối tới Gemini lúc này. Vui lòng kiểm tra lại mã API Key của bạn!';
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const msgHtml = sender === 'user' ? `
                <div class="flex gap-3 justify-end">
                    <div class="bg-teal-700 px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-[85%]">${text}</div>
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-user"></i></div>
                </div>` : `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-sm max-w-[85%]">${text}</div>
                </div>`;
            container.insertAdjacentHTML('beforeend', msgHtml);
            container.scrollTop = container.scrollHeight;
        }

        function clearChat() {
            document.getElementById('chatContainer').innerHTML = `
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center text-sm shrink-0"><i class="fa-solid fa-robot"></i></div>
                    <div class="bg-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-sm max-w-[85%]">Đã xóa lịch sử! Tôi có thể giúp gì thêm cho bạn?</div>
                </div>`;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
